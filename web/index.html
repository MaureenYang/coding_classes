<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C / C++ 練習平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=Noto+Serif+TC:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<style>
/* 版面：技術手冊式的閱讀器 —— 左邊固定的章節欄、中間好讀的內文欄、寬螢幕時右邊是本章段落 */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --ink: #1b2430;
  --muted: #5b6878;
  --rule: #d9dfe6;
  --accent: #1f5f8b;
  --accent-soft: #e3eef6;
  --code-bg: #eef1f4;
  --chunk: #8a4b12;
  --mark: #fff3c4;
  --ok: #1f7a4d;
  --bad: #b23b3b;
  --warn: #9a6a00;
  --tok-type: #2e7d6b;
  --tok-string: #a0403a;
  --tok-number: #7a4fb0;
  --font-display: "IBM Plex Sans Condensed", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-body: "Noto Serif TC", "Songti TC", "PMingLiU", Georgia, serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --rail-w: 280px;
  --toc-w: 220px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151a; --surface: #171c22; --ink: #dfe5ec; --muted: #94a1b0;
    --rule: #2a323c; --accent: #7cb7e3; --accent-soft: #1b2b3a; --code-bg: #0d1116;
    --chunk: #e3a465; --mark: #3a3418; --ok: #5cc98f; --bad: #ef8181; --warn: #e2b54f;
    --tok-type: #6fcfb5; --tok-string: #e8908a; --tok-number: #c3a0ef; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151a; --surface: #171c22; --ink: #dfe5ec; --muted: #94a1b0;
  --rule: #2a323c; --accent: #7cb7e3; --accent-soft: #1b2b3a; --code-bg: #0d1116;
  --chunk: #e3a465; --mark: #3a3418; --ok: #5cc98f; --bad: #ef8181; --warn: #e2b54f;
  --tok-type: #6fcfb5; --tok-string: #e8908a; --tok-number: #c3a0ef; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.85;
  display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100vh; height: 100dvh;
}
:root.fs-l body { font-size: 17.5px; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }

/* ---------- 閱讀進度條 ---------- */
.readbar { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; height: 3px; background: var(--accent); width: 0; z-index: 25; transition: width .1s linear; }

/* ---------- 手機版頂列 ---------- */
.topbar {
  display: none; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--rule);
  padding-block: calc(10px + env(safe-area-inset-top, 0px)) 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  align-items: center; gap: 12px;
}
.topbar .title { font-family: var(--font-display); font-weight: 600; font-size: 15px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- 按鈕 ---------- */
.icon-btn, .btn {
  font: 500 14px var(--font-display); color: var(--ink); background: var(--surface);
  border: 1px solid var(--rule); border-radius: 6px; padding: 6px 12px; cursor: pointer; line-height: 1.3;
}
.icon-btn:hover, .btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover { color: var(--surface); filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: wait; }

/* ---------- 外框 ---------- */
.shell { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); min-height: 0; }

.rail {
  height: 100%; overflow-y: auto;
  background: var(--surface); border-right: 1px solid var(--rule);
  padding-block: 28px 24px;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: 20px;
  display: flex; flex-direction: column; gap: 22px;
}
.brand { display: flex; flex-direction: column; gap: 4px; }
.brand .kicker { font: 600 11px var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.brand h1 { font: 700 22px/1.2 var(--font-display); margin: 0; text-wrap: balance; }
.brand .by { font: 400 13px var(--font-mono); color: var(--muted); }
.brand .by:empty { display: none; }

.tracks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tracks a {
  display: flex; flex-direction: column; text-decoration: none; color: var(--ink);
  border: 1px solid var(--rule); border-radius: 6px; padding: 6px 9px;
  font: 600 14px/1.3 var(--font-display);
}
.tracks a small { font: 500 11px var(--font-mono); color: var(--muted); letter-spacing: .06em; }
.tracks a:hover { border-color: var(--accent); }
.tracks a[aria-current="page"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.tracks a[aria-current="page"] small { color: var(--accent); }

#parts { display: flex; flex-direction: column; gap: 22px; }
.part { display: flex; flex-direction: column; gap: 2px; }
.part-label {
  font: 600 11px var(--font-mono); letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); padding-bottom: 6px; border-bottom: 1px solid var(--rule); margin-bottom: 6px;
  display: flex; justify-content: space-between; gap: 8px;
}
.ch-link {
  display: grid; grid-template-columns: 40px 1fr; gap: 6px; align-items: baseline;
  text-decoration: none; color: var(--ink); padding: 7px 8px; border-radius: 6px;
  font-family: var(--font-display); font-size: 15px; line-height: 1.35;
}
.ch-link .no { font: 500 12px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.ch-link small { display: block; font: 400 12px var(--font-mono); color: var(--muted); margin-top: 2px; }
.ch-link:hover { background: var(--accent-soft); }
.ch-link[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.ch-link[aria-current="page"] .no { color: var(--accent); }
.st-ok { color: var(--ok); } .st-bad { color: var(--bad); }

.rail-foot { margin-top: auto; display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- 主畫面 ---------- */
.main { min-width: 0; min-height: 0; overflow-y: auto; }
.reader {
  display: grid; grid-template-columns: minmax(0, 1fr) var(--toc-w); gap: 40px;
  padding-block: 40px 80px;
  padding-left: max(40px, env(safe-area-inset-left, 0px));
  padding-right: max(32px, env(safe-area-inset-right, 0px));
}
.reader.no-toc { grid-template-columns: minmax(0, 1fr); }
article { min-width: 0; max-width: 46rem; justify-self: center; width: 100%; }

.chapter-head { border-bottom: 2px solid var(--ink); padding-bottom: 18px; margin-bottom: 28px; }
.chapter-head .eyebrow { font: 600 12px var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }

/* ---------- Markdown 內文 ---------- */
.md h1 { font: 700 clamp(26px, 4vw, 34px)/1.25 var(--font-display); margin: 6px 0 0; text-wrap: balance; }
.md h2 {
  font: 700 23px/1.3 var(--font-display); margin: 52px 0 14px; padding-top: 10px;
  border-top: 1px solid var(--rule); text-wrap: balance; scroll-margin-top: 24px;
}
.md > h2:first-child { margin-top: 0; }
/* 內文裡的 h1 是「第一部分」這一層的大段落（章名的 h1 在章首，不受影響） */
.md:not(.chapter-head) > h1 {
  font: 700 clamp(23px, 3.2vw, 28px)/1.3 var(--font-display); margin: 72px 0 18px; padding-top: 16px;
  border-top: 2px solid var(--ink); scroll-margin-top: 24px; text-wrap: balance;
}
.md:not(.chapter-head) > h1:first-child { margin-top: 0; }
.md > h1 + h2 { margin-top: 8px; padding-top: 0; border-top: 0; }
.md h3 { font: 600 18px/1.4 var(--font-display); margin: 32px 0 10px; scroll-margin-top: 24px; text-wrap: balance; }
.md h4 { font: 600 16px var(--font-display); margin: 24px 0 8px; }
.md p { margin: 0 0 16px; }
.md ul, .md ol { padding-left: 1.4em; margin: 0 0 16px; }
.md li { margin: 4px 0; }
.md li > ul, .md li > ol { margin: 4px 0; }
.md li > p { margin: 0 0 6px; }
.md strong, .md b { font-weight: 700; }
.md hr { display: none; }
.md blockquote {
  margin: 20px 0; padding: 12px 18px; background: var(--accent-soft);
  border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0;
}
.md blockquote p:last-child { margin-bottom: 0; }
.chapter-head blockquote { background: transparent; border: none; padding: 0; margin: 10px 0 0; font: 400 13px/1.7 var(--font-mono); color: var(--muted); }
.chapter-head blockquote strong { color: var(--ink); font-weight: 600; }
.chapter-head blockquote p { margin: 0; }

.md code {
  font-family: var(--font-mono); font-size: .86em; background: var(--code-bg);
  padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere;
}
.md code.plink { cursor: pointer; text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.code-wrap { position: relative; margin: 18px 0 22px; }
.md pre {
  margin: 0; background: var(--code-bg); border: 1px solid var(--rule); border-radius: 8px;
  padding: 16px 18px; overflow-x: auto; line-height: 1.6;
}
.md pre code { background: none; padding: 0; font-size: 13.5px; overflow-wrap: normal; white-space: pre; }
.copy-btn {
  position: absolute; top: 8px; right: 8px; font: 500 12px var(--font-mono);
  background: var(--surface); color: var(--muted); border: 1px solid var(--rule);
  border-radius: 5px; padding: 3px 8px; cursor: pointer; opacity: 0; transition: opacity .15s;
}
.code-wrap:hover .copy-btn, .copy-btn:focus-visible { opacity: 1; }
@media (hover: none) { .copy-btn { opacity: 1; } }
.chunk { color: var(--chunk); font-weight: 600; }

.table-wrap { overflow-x: auto; margin: 18px 0 22px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); }
.md table { border-collapse: collapse; width: 100%; font-size: 14.5px; line-height: 1.6; }
.md th, .md td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.md th { font: 600 13px var(--font-display); background: var(--code-bg); white-space: nowrap; }
.md tr:last-child td { border-bottom: none; }

/* highlight.js 的語法顏色，跟著主題變 */
.hljs-keyword, .hljs-meta .hljs-keyword { color: var(--accent); font-weight: 600; }
.hljs-type, .hljs-built_in { color: var(--tok-type); }
.hljs-string, .hljs-meta .hljs-string { color: var(--tok-string); }
.hljs-number, .hljs-literal { color: var(--tok-number); }
.hljs-comment { color: var(--muted); font-style: italic; }
.hljs-meta { color: var(--chunk); }
.hljs-title.function_ { color: var(--ink); font-weight: 600; }

/* ---------- 上一章 / 下一章 ---------- */
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 56px; padding-top: 24px; border-top: 2px solid var(--ink); }
.pager a, .card {
  display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: var(--ink);
  border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; background: var(--surface);
  font-family: var(--font-display); min-width: 0; line-height: 1.4;
}
.pager a:hover, .card:hover { border-color: var(--accent); }
.pager a span, .card span { font: 500 12px var(--font-mono); color: var(--muted); }
.pager a.next { text-align: right; grid-column: 2; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin: 18px 0 8px; }

/* ---------- 本章段落 ---------- */
.toc { position: sticky; top: 40px; align-self: start; max-height: calc(100vh - 80px); overflow-y: auto; font-family: var(--font-display); }
.toc-label { font: 600 11px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.toc ol { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--rule); }
.toc a { display: block; padding: 5px 0 5px 14px; margin-left: -1px; border-left: 2px solid transparent; color: var(--muted); text-decoration: none; font-size: 13.5px; line-height: 1.4; }
.toc a:hover { color: var(--ink); }
.toc a.active { color: var(--accent); border-left-color: var(--accent); }
.toc a.lv1 { color: var(--ink); font-weight: 600; padding-top: 8px; }
.toc a.lv1.active, .toc a.lv1.in-part { color: var(--accent); }
.toc a.lv2 { padding-left: 26px; font-size: 13px; }

/* ---------- 題目工作台 ---------- */
.bench { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); height: 100%; min-height: 0; }
.statement { overflow-y: auto; padding: 32px 32px 64px; border-right: 1px solid var(--rule); min-width: 0; }
.statement .chapter-head { margin-bottom: 20px; }
.workpane { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--surface); }
.toolbar {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px;
  border-bottom: 1px solid var(--rule); background: var(--surface); font-family: var(--font-display);
}
.chk { font: 500 13px var(--font-display); color: var(--muted); display: flex; gap: 5px; align-items: center; }
.saved { font: 400 12px var(--font-mono); color: var(--muted); }
.editor { flex: 1; min-height: 200px; position: relative; }
.editor .CodeMirror, .editor textarea { position: absolute; inset: 0; height: 100%; width: 100%; }
.editor textarea { border: 0; padding: 12px; background: var(--surface); color: var(--ink); resize: none; tab-size: 4; font: 14px/1.6 var(--font-mono); }

/* CodeMirror：用同一組顏色變數，深淺色自動切換 */
.CodeMirror { font: 14px/1.6 var(--font-mono); background: var(--surface); color: var(--ink); }
.CodeMirror-gutters { background: var(--code-bg); border-right: 1px solid var(--rule); }
.CodeMirror-linenumber { color: var(--muted); }
.CodeMirror-cursor { border-left-color: var(--ink); }
.CodeMirror-selected, .CodeMirror-focused .CodeMirror-selected { background: var(--accent-soft) !important; }
.CodeMirror-activeline-background { background: var(--code-bg); }
.CodeMirror-matchingbracket { color: var(--accent) !important; text-decoration: underline; }
.cm-s-default .cm-keyword { color: var(--accent); font-weight: 600; }
.cm-s-default .cm-type, .cm-s-default .cm-variable-3 { color: var(--tok-type); }
.cm-s-default .cm-string, .cm-s-default .cm-string-2 { color: var(--tok-string); }
.cm-s-default .cm-number, .cm-s-default .cm-atom { color: var(--tok-number); }
.cm-s-default .cm-comment { color: var(--muted); font-style: italic; }
.cm-s-default .cm-meta { color: var(--chunk); }
.cm-s-default .cm-def { color: var(--ink); font-weight: 600; }
.cm-s-default .cm-variable, .cm-s-default .cm-operator, .cm-s-default .cm-punctuation, .cm-s-default .cm-property { color: var(--ink); }

.bottom { height: 38%; min-height: 160px; display: flex; flex-direction: column; border-top: 1px solid var(--rule); background: var(--surface); }
.tabs { display: flex; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--rule); }
.tabs button { font: 600 13px var(--font-display); border: 0; border-bottom: 2px solid transparent; background: none; padding: 9px 12px; color: var(--muted); cursor: pointer; }
.tabs button:hover { color: var(--ink); }
.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
.pane { flex: 1; overflow: auto; padding: 12px 14px; display: none; font-family: var(--font-display); font-size: 14px; line-height: 1.6; }
.pane.active { display: block; }
.pane textarea { width: 100%; height: 100%; min-height: 80px; font: 13px/1.55 var(--font-mono); background: var(--code-bg); color: var(--ink); border: 1px solid var(--rule); border-radius: 6px; padding: 8px; resize: vertical; }
.pane input { font: 13px var(--font-mono); padding: 5px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); color: var(--ink); width: 150px; }
.runio { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; height: 100%; }
.runio > div { display: flex; flex-direction: column; min-height: 0; }
.runio small, .io small { font: 600 11px var(--font-mono); letter-spacing: .08em; color: var(--muted); }
pre.out { margin: 0; flex: 1; font: 13px/1.55 var(--font-mono); background: var(--code-bg); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
.verdict { font-weight: 700; font-family: var(--font-mono); }
.v-AC { color: var(--ok); } .v-WA, .v-RE, .v-MLE { color: var(--bad); } .v-TLE, .v-CE { color: var(--warn); }
.summary { font-size: 16px; margin: 2px 0 10px; }
table.res { border-collapse: collapse; width: 100%; font: 13px var(--font-mono); }
table.res td { padding: 4px 8px; border-bottom: 1px solid var(--rule); }
table.res tr.fail { cursor: pointer; } table.res tr.fail:hover { background: var(--accent-soft); }
.detail { margin-bottom: 14px; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--bg); }
.detail:empty { display: none; }
.detail h4 { margin: 10px 0 4px; font: 600 11px var(--font-mono); letter-spacing: .08em; color: var(--muted); }
.detail h4:first-child { margin-top: 0; font-size: 13px; letter-spacing: 0; color: var(--ink); }
.detail code { font-family: var(--font-mono); background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
.testlist details { border: 1px solid var(--rule); border-radius: 6px; margin: 6px 0; padding: 4px 10px; }
.testlist summary { cursor: pointer; font: 13px var(--font-mono); }
.testlist .io { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 6px 0; }
.testlist pre { max-height: 260px; }
.testlist .btn { margin-bottom: 6px; font-size: 13px; padding: 4px 10px; }
.gen-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }

/* ---------- 考卷 ---------- */
.exam { padding-block: 40px 96px; padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); max-width: 1500px; margin: 0 auto; }
.exam-head { max-width: 62rem; }
.exam-bar {
  position: sticky; top: 0; z-index: 6; background: var(--bg);
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  padding: 12px 0; margin-bottom: 18px; border-bottom: 1px solid var(--rule); font-family: var(--font-display);
}
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.seg button { font: 500 14px var(--font-display); background: var(--surface); color: var(--ink); border: 0; padding: 6px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button.on { background: var(--accent); color: var(--surface); }
.exam-stat { font: 500 13px var(--font-mono); color: var(--muted); }
.chap-filter { position: relative; }
.chap-filter summary { list-style: none; cursor: pointer; }
.chap-filter summary::-webkit-details-marker { display: none; }
.chap-panel {
  position: absolute; z-index: 8; top: calc(100% + 6px); left: 0; width: min(420px, 86vw); max-height: 60vh; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; box-shadow: 0 10px 30px rgba(0,0,0,.15);
}
.chap-panel label { display: flex; gap: 8px; align-items: baseline; padding: 4px 2px; font-size: 14px; cursor: pointer; }
.chap-panel label span { font: 500 12px var(--font-mono); color: var(--muted); min-width: 34px; }
.chap-panel .row { display: flex; gap: 8px; margin-bottom: 6px; }
.exam-ch { font: 700 21px/1.3 var(--font-display); margin: 40px 0 14px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.exam-ch .no { font: 600 13px var(--font-mono); color: var(--accent); }
.exam-ch a { font: 500 13px var(--font-mono); }
.q {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  border: 1px solid var(--rule); border-left-width: 4px; border-radius: 10px; background: var(--surface);
  margin: 0 0 18px; overflow: hidden;
}
.q.g-ok { border-left-color: var(--ok); }
.q.g-bad { border-left-color: var(--bad); }
.q-main { padding: 18px 22px 20px; min-width: 0; }
.q-ans { padding: 18px 22px 20px; background: var(--bg); border-left: 1px solid var(--rule); min-width: 0; display: flex; flex-direction: column; }

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const pad = n => String(n).padStart(2, "0");
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

async function api(path, body) {
  const opt = body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {};
  const r = await fetch(path, opt);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

let problems = [], lessons = [], parts = {}, current = null, currentLang = "cpp", currentFile = "", editor = null, saveTimer = null;

applyFs(store.get("fs") === "l");
$("#fsBtn").onclick = toggleFs;

/* ---------- Markdown ---------- */
// 沒有網路（CDN 載不到 marked）時用的簡易 Markdown 轉換
function miniMd(md) {
  const inline = t => esc(t)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
    .replace(/&lt;(https?:[^&]+)&gt;/g, '<a href="$1">$1</a>');
  const lines = md.split("\n"), out = [];
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (l.startsWith("```")) {
      const lang = l.slice(3).trim(), buf = [];
      while (++i < lines.length && !lines[i].startsWith("```")) buf.push(lines[i]);
      out.push(`<pre><code${lang ? ` class="language-${esc(lang)}"` : ""}>${esc(buf.join("\n"))}</code></pre>`);
    } else if (/^#{1,6} /.test(l)) {
      const n = l.indexOf(" ");
      out.push(`<h${n}>${inline(l.slice(n + 1))}</h${n}>`);
    } else if (l.startsWith("|")) {
      const rows = [];
      for (; i < lines.length && lines[i].startsWith("|"); i++) rows.push(lines[i]);
      i--;
      const cells = r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      out.push("<table>" + rows.filter(r => !/^\|[\s|:-]+\|$/.test(r)).map((r, k) =>
        "<tr>" + cells(r).map(c => k ? `<td>${inline(c)}</td>` : `<th>${inline(c)}</th>`).join("") + "</tr>").join("") + "</table>");
    } else if (/^\s*([-*]|\d+\.) /.test(l)) {
      const ordered = /^\s*\d+\./.test(l), items = [];
      for (; i < lines.length && /^\s*([-*]|\d+\.) /.test(lines[i]); i++) items.push(lines[i].replace(/^\s*([-*]|\d+\.) /, ""));
      i--;
      const tag = ordered ? "ol" : "ul";
      out.push(`<${tag}>${items.map(t => `<li>${inline(t)}</li>`).join("")}</${tag}>`);
    } else if (l.startsWith(">")) {
      const buf = [];
      for (; i < lines.length && lines[i].startsWith(">"); i++) buf.push(lines[i].replace(/^>\s?/, ""));
      i--;
      out.push(`<blockquote>${buf.filter(x => x.trim()).map(x => `<p>${inline(x)}</p>`).join("")}</blockquote>`);
    } else if (l.trim() && !/^-{3,}$/.test(l.trim())) {
      out.push(`<p>${inline(l)}</p>`);
    }
  }
  return out.join("\n");
}

function mdToHtml(md) { return window.marked ? marked.parse(md, {gfm: true, breaks: false}) : miniMd(md); }

// 把 Markdown 轉成「章首 + 內文」：第一個 h1 和緊接的 blockquote 放進章首
function buildDoc(md, eyebrow) {
  const tmp = document.createElement("div");
  tmp.innerHTML = mdToHtml(md);
  const head = document.createElement("header");
  head.className = "chapter-head md";
  head.innerHTML = `<div class="eyebrow">${esc(eyebrow)}</div>`;
  const h1 = tmp.querySelector("h1");
  if (h1 && h1 === tmp.firstElementChild) {
    head.appendChild(h1);
    const next = tmp.firstElementChild;
    if (next && next.tagName === "BLOCKQUOTE") head.appendChild(next);
  }
  const body = document.createElement("div");
  body.className = "md";
  while (tmp.firstChild) body.appendChild(tmp.firstChild);
  decorate(body);
  return {head, body};
}

// 表格加外框、程式碼上色、標出文學式程式設計的區塊名稱〈...〉、加「複製」按鈕
function decorate(body) {
  body.querySelectorAll("table").forEach(t => {
    const w = document.createElement("div"); w.className = "table-wrap";
    t.parentNode.insertBefore(w, t); w.appendChild(t);
  });
  body.querySelectorAll("pre > code").forEach(code => {
    const raw = code.textContent;
    const lang = (code.className.match(/language-(\w[\w+]*)/) || [])[1];
    if (lang && window.hljs) {
      const l = lang === "c++" ? "cpp" : lang;
      try { if (hljs.getLanguage(l)) code.innerHTML = hljs.highlight(raw, {language: l}).value; } catch (e) {}
    }
    code.innerHTML = code.innerHTML.replace(/〈[^〉\n]+〉(\+?≡)?/g, m => `<span class="chunk">${m}</span>`);
    const pre = code.parentNode;
    const wrap = document.createElement("div"); wrap.className = "code-wrap";
    pre.parentNode.insertBefore(wrap, pre); wrap.appendChild(pre);
    const btn = document.createElement("button");
    btn.className = "copy-btn"; btn.type = "button"; btn.textContent = "複製";
    btn.onclick = () => {
      const done = () => { btn.textContent = "已複製"; setTimeout(() => btn.textContent = "複製", 1200); };
      if (navigator.clipboard) navigator.clipboard.writeText(raw).then(done, () => fallbackCopy(raw, done));
      else fallbackCopy(raw, done);
    };
    wrap.appendChild(btn);
  });
  // 教學裡提到的題目（problems/xx、CL03、C08……）可以直接點過去
  body.querySelectorAll("code").forEach(c => {
    if (c.parentNode.tagName === "PRE") return;
    const m = c.textContent.match(/^(?:(?:cpp\/|c\/)?problems\/)?((?:cl|c)?\d\d_[a-z0-9_]+)(?:\/problem\.md)?$/);
    const m2 = c.textContent.match(/^(CL|C)(\d\d)\b/);
    const pid = m ? m[1] : m2 ? (problems.find(p => p.id.startsWith(m2[1].toLowerCase() + m2[2] + "_")) || {}).id : null;
    if (pid && problems.some(p => p.id === pid)) {
      c.classList.add("plink");
      c.onclick = () => location.hash = "problem/" + pid;
    }
  });
}
function fallbackCopy(text, done) {
  const t = document.createElement("textarea");
  t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
  document.body.appendChild(t); t.select();
  try { document.execCommand("copy"); done(); } catch (e) {}
  t.remove();
}

/* ---------- 路線與側欄 ---------- */
const TRACK = {
  ds:  {name: "資料結構", kicker: "C++ 練習平台 · 路線一", eyebrow: "Lesson"},
  cpp: {name: "C++ 深入", kicker: "C++ 練習平台 · 路線二", eyebrow: "Lesson"},
  c:   {name: "C 語言", kicker: "C 練習平台 · 路線三", eyebrow: "Lesson"},
  cii: {name: "C 介面與實作", kicker: "讀書筆記 · 中文", eyebrow: "Chapter"},
};
const lessonHash = name => (track === "ds" ? "lesson/" : track + "/lesson/") + name;
const pidLabel = id => id.split("_")[0].toUpperCase();

// 由網址判斷目前在哪一條路線：#cpp、#cpp/lesson/...、#problem/c07_... 是 C++ 深入；
// #c、#c/lesson/...、#problem/cl03_... 是 C 語言；#cii、#cii/lesson/... 是讀本
function trackOfHash(h) {
  const ex = h.match(/^exam\/(\w+)/);
  if (ex && TRACK[ex[1]]) return ex[1];
  if (h === "cii" || h.startsWith("cii/")) return "cii";
  if (h === "cpp" || h.startsWith("cpp/")) return "cpp";
  if (h === "c" || h.startsWith("c/")) return "c";
  const m = h.match(/^problem\/(.+)/);
  if (m && /^cl\d/.test(m[1])) return "c";
  return m && /^c\d/.test(m[1]) ? "cpp" : "ds";
}

// 「07. 動態記憶體」→ 編號 07、標題「動態記憶體」；「第 3 章　Atoms（原子字串）」→ 03、Atoms、原子字串
function lessonInfo(l) {
  const no = (l.name.match(/^(?:ch)?(\d+[a-z]?)/) || [])[1] || "";
  let t = l.title.replace(/^第\s*\d+\s*章\s*/, "").replace(/^\d+[a-z]?\.\s*/, "");
  let sub = "";
  const m = t.match(/^(.+?)（(.+)）$/);
  if (m) { t = m[1]; sub = m[2]; }
  return {no, title: t, sub};
}

async function loadNav() {
  [problems, lessons, parts] = await Promise.all([
    api("/api/problems?track=" + track), api("/api/lessons?track=" + track), api("/api/parts?track=" + track)]);
  const info = TRACK[track], book = parts.book || {};
  $("#kicker").textContent = book.kicker || info.kicker;
  $("#brandTitle").textContent = book.title || info.name;
  const solved = problems.filter(p => p.solved).length;
  $("#brandBy").textContent = book.by || (problems.length ? `已通過 ${solved} / ${problems.length} 題` : "");
  document.querySelectorAll("#tracks a").forEach(a =>
    a.dataset.t === track ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));

  const link = l => {
    const i = lessonInfo(l), k = lessonHash(l.name);
    return `<a class="ch-link" href="#${esc(k)}" data-k="${esc(k)}"><span class="no">${esc(i.no)}</span>
      <span>${esc(i.title)}${i.sub ? `<small>${esc(i.sub)}</small>` : ""}</span></a>`;
  };
  let html = "";
  const groups = parts.parts || [];
  if (groups.length) {
    groups.forEach((g, gi) => {
      const ls = lessons.filter(l => l.part === gi);
      html += `<div class="part"><div class="part-label"><span>${esc(g.label)}</span><span>${esc(g.range || ls.length)}</span></div>${ls.map(link).join("")}</div>`;
    });
    const rest = lessons.filter(l => l.part === null || l.part === undefined);
    if (rest.length) html += `<div class="part"><div class="part-label"><span>其他</span><span>${rest.length}</span></div>${rest.map(link).join("")}</div>`;
  } else if (lessons.length) {
    html += `<div class="part"><div class="part-label"><span>教學 · Lessons</span><span>${lessons.length}</span></div>${lessons.map(link).join("")}</div>`;
  }
  html = `<div class="part"><div class="part-label"><span>考卷 · Exam</span><span>自我檢測</span></div>
    <a class="ch-link" href="#exam/${track}" data-k="exam/${track}"><span class="no">✎</span>
    <span>總複習考卷<small>照章節或打亂出題 · 寫完自己對答案</small></span></a></div>` + html;
  if (problems.length) {
    const st = p => p.solved ? '<span class="st-ok">✔ 已通過</span>' : p.verdict ? `<span class="st-bad">✘ ${esc(p.verdict)}</span>`
                  : p.started ? "作答中" : "未開始";
    html += `<div class="part"><div class="part-label"><span>題目 · Problems</span><span>${solved}/${problems.length}</span></div>` +
      problems.map(p => `<a class="ch-link" href="#problem/${esc(p.id)}" data-k="problem/${esc(p.id)}"><span class="no">${esc(pidLabel(p.id))}</span>
        <span>${esc(p.title)}<small>${st(p)} · ${esc(p.difficulty)}</small></span></a>`).join("") + `</div>`;
  }
  $("#parts").innerHTML = html;
  highlightNav();
}
function highlightNav() {
  const k = decodeURIComponent(location.hash.slice(1));
  document.querySelectorAll("#parts .ch-link").forEach(a =>
    a.dataset.k === k ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
}

/* ---------- 閱讀頁：本章段落、進度條 ---------- */
let tocHeads = [];
function slug(text, used) {
  let s = text.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-|-$/g, "") || "sec";
  const base = s;
  for (let i = 2; used.has(s); i++) s = base + "-" + i;
  used.add(s);
  return s;
}
function showReader(head, body, pager, withToc = true) {
  const used = new Set();
  tocHeads = [];
  // 內文有 h1（「第一部分」這一層）時，本章段落分兩層：h1 一直顯示，h2 只展開目前所在的部分
  const hasParts = !!body.querySelector(":scope > h1");
  let part = -1;
  body.querySelectorAll("h1, h2, h3").forEach(h => {
    h.id = slug(h.textContent, used);
    if (h.tagName === "H1") { part++; h.dataset.part = part; tocHeads.push(h); }
    else if (h.tagName === "H2") { h.dataset.part = part; tocHeads.push(h); }
  });
  tocHeads.hasParts = hasParts;
  const toc = withToc && tocHeads.length > 1;
  const main = $("#main");
  main.innerHTML = `<div class="reader${toc ? "" : " no-toc"}"><article id="article"></article>${toc ?
    `<aside class="toc" aria-label="本章段落"><div class="toc-label">本章段落</div><ol id="toc"></ol></aside>` : ""}</div>`;
  const article = $("#article");
  article.append(head, body);
  if (pager) article.appendChild(pager);
  if (toc) {
    $("#toc").innerHTML = tocHeads.map(h => {
      const lv = !hasParts ? "" : h.tagName === "H1" ? "lv1" : "lv2";
      return `<li${lv === "lv2" ? ` data-part="${h.dataset.part}"` : ""}><a href="#" class="${lv}" data-target="${h.id}">${esc(h.textContent)}</a></li>`;
    }).join("");
    $("#toc").querySelectorAll("a").forEach(a => a.onclick = e => {
      e.preventDefault();
      document.getElementById(a.dataset.target).scrollIntoView({behavior: "smooth", block: "start"});
    });
  }
  main.scrollTop = 0;
  onScroll();
}
function onScroll() {
  const main = $("#main"), bar = $("#readbar");
  if (!$("#article")) { bar.style.width = "0"; return; }
  const max = main.scrollHeight - main.clientHeight;
  bar.style.width = (max > 0 ? Math.min(100, main.scrollTop / max * 100) : 0) + "%";
  if (!$("#toc")) return;
  const top = main.getBoundingClientRect().top + 90;
  let active = tocHeads[0];
  for (const h of tocHeads) { if (h.getBoundingClientRect().top <= top) active = h; else break; }
  $("#toc").querySelectorAll("a").forEach(a => a.classList.toggle("active", active && a.dataset.target === active.id));
  if (tocHeads.hasParts && active) {
    const part = active.dataset.part;
    $("#toc").querySelectorAll("li[data-part]").forEach(li => li.hidden = li.dataset.part !== part);
    $("#toc").querySelectorAll("a.lv1").forEach(a => a.classList.toggle("in-part",
      document.getElementById(a.dataset.target).dataset.part === part && a.dataset.target !== active.id));
  }
}

/* ---------- 考卷 ---------- */
let exam = null, examTimer = null;

function seededRandom(seed) {                   // mulberry32：同一個 seed 每次打亂的順序都一樣
  return () => {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const newSeed = () => Math.floor(Math.random() * 2147483647);

function examSaveSoon() {
  clearTimeout(examTimer);
  examTimer = setTimeout(examFlush, 700);
}
async function examFlush() {
  if (!examTimer || !exam) return;
  clearTimeout(examTimer); examTimer = null;
  try { await api("/api/exam_state", {track: exam.track, state: exam.state}); }
  catch (e) { const s = $("#examSaved"); if (s) s.textContent = "儲存失敗：" + e.message; }
}

function lessonOf(no) {
  return lessons.find(l => l.name.startsWith(no + "_") || l.name.startsWith(no + "-"));
}
function chapterOf(no) { return exam.chapters.find(c => c.no === no) || {no, title: ""}; }
const chNo = no => String(no).replace(/^ch/, "");

function examQuestions() {
  const st = exam.state;
  const sel = new Set(st.chapters || exam.chapters.map(c => c.no));
  let qs = exam.questions.filter(q => sel.has(q.chapter));
  if (st.mode === "shuffle") {
    const r = seededRandom(st.seed);
    qs = qs.slice();
    for (let i = qs.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      [qs[i], qs[j]] = [qs[j], qs[i]];
    }
  }
  return qs;
}

async function showExam(t) {
  const ex = await api("/api/exam?track=" + encodeURIComponent(t));
  exam = Object.assign(ex, {track: t});
  const st = exam.state;
  st.answers = st.answers || {};
  st.revealed = st.revealed || {};
  st.grade = st.grade || {};
  if (st.mode !== "shuffle") st.mode = "chapter";
  if (!Number.isInteger(st.seed)) st.seed = newSeed();
  if (Array.isArray(st.chapters)) st.chapters = st.chapters.filter(no => exam.chapters.some(c => c.no === no));
  else delete st.chapters;
  $("#topTitle").textContent = exam.title;
  $("#readbar").style.width = "0";
  renderExam();
}

function renderExam() {
  const st = exam.state, main = $("#main");
  const sel = new Set(st.chapters || exam.chapters.map(c => c.no));
  main.innerHTML = `
    <div class="exam">
      <header class="chapter-head md exam-head" id="examHead"></header>
      <div class="exam-bar">
        <div class="seg" role="group" aria-label="出題順序">
          <button data-mode="chapter" class="${st.mode === "chapter" ? "on" : ""}">照章節</button>
          <button data-mode="shuffle" class="${st.mode === "shuffle" ? "on" : ""}">打亂</button>
        </div>
        <button class="btn" id="reshuffle">重新打亂</button>
        <details class="chap-filter">
          <summary class="btn">章節 ${sel.size}/${exam.chapters.length} ▾</summary>
          <div class="chap-panel">
            <div class="row"><button class="btn" id="chAll">全選</button><button class="btn" id="chNone">全不選</button></div>
            ${exam.chapters.map(c => `<label><input type="checkbox" value="${esc(c.no)}" ${sel.has(c.no) ? "checked" : ""}>
              <span>${esc(chNo(c.no))}</span>${esc(c.title)}</label>`).join("")}
          </div>
        </details>
        <span class="exam-stat" id="examStat"></span>
        <span style="flex:1"></span>
        <button class="btn primary" id="revealAll">交卷：顯示全部答案</button>
        <button class="btn" id="resetExam">重新作答</button>
      </div>
      <div id="qlist"></div>
      <section class="exam-summary" id="examSummary"></section>
    </div>`;

  const {head} = buildDoc(`# ${exam.title}\n\n${exam.intro.split("\n").map(l => "> " + l).join("\n")}`,
                          `Exam · ${TRACK[exam.track].name}`);
  $("#examHead").replaceWith(head);
  head.classList.add("exam-head");

  const qs = examQuestions();
  const list = $("#qlist");
  let lastCh = null;
  qs.forEach((q, i) => {
    if (st.mode === "chapter" && q.chapter !== lastCh) {
      lastCh = q.chapter;
      const c = chapterOf(q.chapter), l = lessonOf(q.chapter);
      list.insertAdjacentHTML("beforeend", `<h2 class="exam-ch"><span class="no">${esc(TRACK[exam.track].eyebrow)} ${esc(chNo(c.no))}</span>${esc(c.title)}
        ${l ? `<a href="#${esc(lessonHash(l.name))}">讀這一章 →</a>` : ""}</h2>`);
    }
    list.appendChild(renderQuestion(q, i + 1));
  });
  if (!qs.length) list.innerHTML = `<p class="muted">沒有選任何章節。按上面的「章節」選擇要考的範圍。</p>`;

  document.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
    st.mode = b.dataset.mode; examSaveSoon(); renderExam();
  });
  $("#reshuffle").onclick = () => { st.mode = "shuffle"; st.seed = newSeed(); examSaveSoon(); renderExam(); };
  const setChapters = nos => {
    st.chapters = nos.length === exam.chapters.length ? undefined : nos;
    if (!st.chapters) delete st.chapters;
    examSaveSoon(); renderExam();
    const d = $(".chap-filter"); if (d) d.open = true;
  };
  document.querySelectorAll(".chap-panel input").forEach(cb => cb.onchange = () =>
    setChapters([...document.querySelectorAll(".chap-panel input:checked")].map(x => x.value)));
  $("#chAll").onclick = () => setChapters(exam.chapters.map(c => c.no));
  $("#chNone").onclick = () => setChapters([]);
  $("#revealAll").onclick = () => {
    const left = qs.filter(q => !(st.answers[q.id] || "").trim()).length;
    if (left && !confirm(`還有 ${left} 題沒有作答，確定要交卷、顯示全部答案嗎？`)) return;
    qs.forEach(q => st.revealed[q.id] = true);
    examSaveSoon(); renderExam();
    $("#examSummary").scrollIntoView({behavior: "smooth", block: "start"});
  };
  $("#resetExam").onclick = () => {
    if (!confirm("確定要清除這份考卷所有的作答、答案顯示和自評嗎？")) return;
    st.answers = {}; st.revealed = {}; st.grade = {}; st.seed = newSeed();
    examSaveSoon(); renderExam();
  };
  updateExamStats();
}

function renderQuestion(q, n) {
  const st = exam.state, c = chapterOf(q.chapter);
  const sec = document.createElement("section");
  sec.className = "q" + (st.grade[q.id] ? " g-" + st.grade[q.id] : "");
  sec.id = "q-" + q.id;
  sec.innerHTML = `
    <div class="q-main">
      <div class="q-meta"><span class="q-no">${n}.</span>
        <span class="tag">${esc(TRACK[exam.track].eyebrow)} ${esc(chNo(c.no))} · ${esc(c.title)}</span>
        <span class="tag">${esc(q.type)}</span></div>
      <div class="md q-body"></div>
      <label class="ans-label" for="in-${esc(q.id)}">你的答案</label>
      <textarea class="q-input" id="in-${esc(q.id)}" spellcheck="false" placeholder="寫下你的答案，會自動儲存……"></textarea>
      <div class="q-actions"><button class="btn reveal">${st.revealed[q.id] ? "隱藏答案" : "看答案"}</button><span class="saved-note"></span></div>
    </div>
    <aside class="q-ans" aria-live="polite"></aside>`;
  const body = sec.querySelector(".q-body");
  body.innerHTML = mdToHtml(q.q);
  decorate(body);
  const ta = sec.querySelector("textarea");
  ta.value = st.answers[q.id] || "";
  const fit = () => { ta.style.height = "auto"; ta.style.height = Math.max(96, ta.scrollHeight + 2) + "px"; };
  ta.addEventListener("input", () => { st.answers[q.id] = ta.value; fit(); examSaveSoon(); updateExamStats(); });
  ta.addEventListener("keydown", e => {
    if (e.key === "Tab" && !e.shiftKey) { e.preventDefault(); ta.setRangeText("    ", ta.selectionStart, ta.selectionEnd, "end"); ta.dispatchEvent(new Event("input")); }
  });
  requestAnimationFrame(fit);
  sec.querySelector(".reveal").onclick = () => {
    st.revealed[q.id] = !st.revealed[q.id];
    examSaveSoon(); fillAnswer(sec, q); updateExamStats();
  };
  fillAnswer(sec, q);
  return sec;
}

function fillAnswer(sec, q) {
  const st = exam.state, box = sec.querySelector(".q-ans");
  sec.querySelector(".reveal").textContent = st.revealed[q.id] ? "隱藏答案" : "看答案";
  if (!st.revealed[q.id]) {
    box.innerHTML = `<div class="ans-hidden"><span>先把答案寫在左邊，<br>寫完再看參考答案。</span><button class="btn">看答案</button></div>`;
    box.querySelector("button").onclick = () => sec.querySelector(".reveal").click();
    return;
  }
  const g = st.grade[q.id];
  box.innerHTML = `<span class="ans-label">參考答案</span><div class="md ans-body"></div>
    <div class="grade"><span>自評：</span>
      <button class="btn ${g === "ok" ? "on-ok" : ""}" data-g="ok">✔ 我答對了</button>
      <button class="btn ${g === "bad" ? "on-bad" : ""}" data-g="bad">✘ 還不熟</button>
      <button class="hide-ans">隱藏答案</button></div>`;
  const body = box.querySelector(".ans-body");
  body.innerHTML = mdToHtml(q.a);
  decorate(body);
  box.querySelectorAll("[data-g]").forEach(b => b.onclick = () => {
    st.grade[q.id] = st.grade[q.id] === b.dataset.g ? undefined : b.dataset.g;
    if (!st.grade[q.id]) delete st.grade[q.id];
    sec.className = "q" + (st.grade[q.id] ? " g-" + st.grade[q.id] : "");
    examSaveSoon(); fillAnswer(sec, q); updateExamStats();
  });
  box.querySelector(".hide-ans").onclick = () => sec.querySelector(".reveal").click();
}

function updateExamStats() {
  const st = exam.state, qs = examQuestions();
  const answered = qs.filter(q => (st.answers[q.id] || "").trim()).length;
  const revealed = qs.filter(q => st.revealed[q.id]).length;
  const ok = qs.filter(q => st.grade[q.id] === "ok").length;
  const bad = qs.filter(q => st.grade[q.id] === "bad").length;
  $("#examStat").innerHTML = `已作答 ${answered}/${qs.length} · 已對答案 ${revealed} · <span class="st-ok">✔ ${ok}</span> <span class="st-bad">✘ ${bad}</span>`;

  const rows = [];
  for (const c of exam.chapters) {
    const cq = qs.filter(q => q.chapter === c.no);
    if (!cq.length) continue;
    const cok = cq.filter(q => st.grade[q.id] === "ok").length;
    const cbad = cq.filter(q => st.grade[q.id] === "bad").length;
    const l = lessonOf(c.no);
    const advice = cbad ? (l ? `<a href="#${esc(lessonHash(l.name))}">重讀這一章</a>` : "重讀這一章")
                 : cok === cq.length ? "✔ 掌握了" : "";
    rows.push(`<tr><td>${esc(chNo(c.no))}</td><td>${esc(c.title)}</td><td>${cq.length}</td>
      <td class="st-ok">${cok || ""}</td><td class="st-bad">${cbad || ""}</td><td>${cq.length - cok - cbad || ""}</td><td>${advice}</td></tr>`);
  }
  const graded = ok + bad;
  $("#examSummary").innerHTML = `<h2>成績與複習建議</h2>
    <div class="score">${graded ? `自評正確率 ${Math.round(ok / graded * 100)}%（${ok}/${graded}）` : "還沒有自評的題目"}；共 ${qs.length} 題，${qs.length - graded} 題還沒自評。</div>
    <div class="md"><div class="table-wrap"><table>
      <tr><th>章</th><th>主題</th><th>題數</th><th>✔</th><th>✘</th><th>未自評</th><th>建議</th></tr>${rows.join("")}
    </table></div>
    <p class="muted">每一題看完答案後按「✔ 我答對了」或「✘ 還不熟」。標成 ✘ 的章節，回去重讀那一章對應的段落，過幾天再「打亂」重考一次。</p></div>`;
}

/* ---------- 路由 ---------- */
async function route() {
  if (saveTimer && current && editor) await save(false);  // 切換頁面前先存檔
  await examFlush();
  editor = null;
  openRail(false);
  const h = decodeURIComponent(location.hash.slice(1));
  const t = trackOfHash(h);
  if (t !== navTrack) { track = t; await loadNav(); navTrack = t; }
  highlightNav();
  try {
    if (h.startsWith("lesson/")) await showLesson(h.slice(7));
    else if (/^(cpp|c|cii)\/lesson\//.test(h)) await showLesson(h.replace(/^(cpp|c|cii)\/lesson\//, ""));
    else if (h.startsWith("problem/")) await showProblem(h.slice(8));
    else if (h.startsWith("exam/")) await showExam(h.slice(5));
    else showWelcome();
  } catch (e) {
    $("#main").innerHTML = `<div class="reader no-toc"><article class="md"><p>錯誤：${esc(e.message)}</p></article></div>`;
  }
}

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
